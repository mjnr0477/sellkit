name: VYBORA Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/vybora-android-capacitor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Capacitor dependencies
        run: npm install
      - name: Prepare web assets and generate Android project
        run: npm run android:sync
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build debug Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleDebug
      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vybora-android-test-packages
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
