name: VYBORA Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/vybora-android-capacitor]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets and generate Android project
        run: npm run android:sync

      - name: Verify Android wrapper points to live VYBORA website
        shell: bash
        run: |
          set -euo pipefail
          test -s www/index.html
          grep -Fq 'https://vybora-social-live.onrender.com/' www/index.html
          grep -Fq 'window.location.replace(target)' www/index.html
          grep -Fq "await fetch(target, { mode: 'no-cors'" www/index.html
          if grep -Fq 'social-features.js' www/index.html; then
            echo "::error::Android launcher must not bundle the frozen frontend."
            exit 1
          fi

      - name: Set up Python for launcher icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply VYBORA launcher icon
        run: |
          python -m pip install pillow
          python scripts/prepare-android-icon.py

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/vybora-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Could not find Android buildTypes block; refusing to alter unknown Gradle layout.")
              signing = """    signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
              s = s.replace(marker, signing + marker, 1)
          build_types_marker = "    buildTypes {"
          if build_types_marker not in s:
              raise SystemExit("Could not find Android buildTypes block; refusing to alter unknown Gradle layout.")
          release_marker = "        release {"
          release_start = s.find(release_marker, s.index(build_types_marker))
          if release_start < 0:
              raise SystemExit("Could not find release build type inside buildTypes; refusing to alter unknown Gradle layout.")
          pos = release_start + len(release_marker)
          following = s[pos:pos + 300]
          if "signingConfig signingConfigs.release" not in following:
              s = s[:pos] + "\n            signingConfig signingConfigs.release" + s[pos:]
          p.write_text(s)
          PY

      - name: Build release-signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build release-signed Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify release packages exist
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed APK and AAB release candidates
        uses: actions/upload-artifact@v4
        with:
          name: vybora-android-signed-release-candidates
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish public APK and AAB download links
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vybora-android-build-${{ github.run_number }}
          name: VYBORA Android build ${{ github.run_number }}
          body: |
            VYBORA Android release candidate.
            Includes the installable APK and the Android App Bundle (AAB).
            Please test on a physical Android device before wider distribution.
            Live links point to official event providers; availability and free access depend on country and broadcast rights.
          prerelease: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
