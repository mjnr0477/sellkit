name: Time-Based Internet Proof Core

on:
  push:
    branches:
      - invention/time-based-internet-v1
    paths:
      - 'time-internet/**'
      - '.github/workflows/time-internet-proof.yml'
  pull_request:
    paths:
      - 'time-internet/**'
      - '.github/workflows/time-internet-proof.yml'
  workflow_dispatch:

jobs:
  entitlement-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-internet
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run entitlement tests
        run: npm test
