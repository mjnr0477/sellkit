name: VYBORA hosted browser smoke
on:
  push:
    branches: [main, feat/vybora-social-universe-mvp]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/vybora-browser-smoke.cjs'
      - '.github/workflows/vybora-browser-smoke.yml'
  workflow_dispatch:
jobs:
  hosted-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VYBORA_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || (github.ref == 'refs/heads/main' && 'https://vybora-social-live.onrender.com' || 'https://vybora-social-preview.onrender.com') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve pull-request frontend locally
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vybora-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - run: node --test tests/vybora-browser-smoke.cjs
